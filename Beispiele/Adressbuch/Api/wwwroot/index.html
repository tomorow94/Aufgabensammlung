<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adressbuch</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Adressbuch</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <form id="contactForm">
      <label for="name">Name</label>
      <input id="name" name="name" required maxlength="100">
      <label for="age">Alter</label>
      <input id="age" name="age" type="number" min="0" max="130" value="0" required>
      <label for="gender">Geschlecht</label>
      <select id="gender" name="gender">
        <option value="0">Keine Angabe</option><option value="1">Männlich</option>
        <option value="2">Weiblich</option><option value="3">Divers</option>
      </select>
      <label for="phoneNumber">Telefonnummer</label>
      <input id="phoneNumber" name="phoneNumber" type="tel" required maxlength="50">
      <label for="email">E-Mail</label>
      <input id="email" name="email" type="email" required maxlength="200">
      <button type="submit">Kontakt hinzufügen</button>
    </form>
    <h2>Kontakte</h2>
    <button id="reload" type="button">Liste neu laden</button>
    <ul id="contacts"></ul>
  </main>
</body>
</html>
